services:
  web:
    build: .
    container_name: django_dev
    ports:
      - "8000:8000"
    volumes:
      - ".:/app"
    depends_on:
      - "db"

  db:
    image: "postgres:16"
    container_name: postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: 
      - "5432:5432"
    volumes:
      - "db_data:/var/lib/postgresql/data"

volumes:
  db_data: